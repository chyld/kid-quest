<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parent Dashboard</title>
    <link rel="stylesheet" href="index.css">
        <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png">
</head>
<body>
    <div class="zyx-master-container">
        <header class="zyx-header">
            <h1 class="zyx-page-title">Parent Dashboard</h1>
        </header>

        <main class="zyx-main-content">
            <!-- Reward Management Section -->
            <section class="zyx-reward-section">
                <div class="zyx-reward-display">
                    <h2 class="zyx-section-title">Current Reward</h2>
                    <div class="zyx-reward-info">
                        <span class="zyx-reward-amount" id="currentReward">0</span>
                        <span class="zyx-reward-unit">minutes</span>
                        <button class="zyx-refresh-btn" onclick="loadReward()" type="button" aria-label="Refresh reward amount">
                            Refresh
                        </button>
                    </div>
                </div>
                
                <div class="zyx-reward-form-container">
                    <form id="rewardForm" class="zyx-reward-form">
                        <fieldset class="zyx-form-fieldset">
                            <legend class="zyx-form-legend">Update Reward</legend>
                            <div class="zyx-input-group">
                                <label for="newReward" class="zyx-input-label">New Reward Amount</label>
                                <input type="number" id="newReward" name="newReward" min="0" required 
                                       class="zyx-reward-input" placeholder="Enter minutes">
                                <button type="submit" class="zyx-submit-btn">Update Reward</button>
                            </div>
                        </fieldset>
                    </form>
                </div>
            </section>
            
            <!-- Task Creation Section -->
            <section class="zyx-task-creation-section">
                <h2 class="zyx-section-title">Create New Task</h2>
                <div class="zyx-task-form-container">
                    <form id="taskForm" class="zyx-task-form">
                        <fieldset class="zyx-form-fieldset">
                            <legend class="zyx-form-legend">Task Details</legend>
                            <div class="zyx-form-grid">
                                <div class="zyx-input-group zyx-full-width">
                                    <label for="taskTitle" class="zyx-input-label">Task Title</label>
                                    <textarea id="taskTitle" name="title" rows="4" required 
                                              class="zyx-task-title-input" placeholder="Describe the task..."></textarea>
                                </div>
                                <div class="zyx-input-group">
                                    <label for="taskReward" class="zyx-input-label">Reward (minutes)</label>
                                    <input type="number" id="taskReward" name="reward" min="1" required 
                                           class="zyx-task-reward-input" placeholder="Enter reward">
                                </div>
                            </div>
                            <div class="zyx-form-actions">
                                <button type="submit" class="zyx-submit-btn zyx-primary-btn">Create Task</button>
                            </div>
                        </fieldset>
                    </form>
                </div>
            </section>

            <!-- Tasks Management Section -->
            <section class="zyx-tasks-section">
                <div class="zyx-tasks-header">
                    <h2 class="zyx-section-title">Tasks</h2>
                    <button class="zyx-download-btn" onclick="downloadCSV()" type="button" aria-label="Download tasks as CSV">
                        Download CSV
                    </button>
                </div>
                
                <div class="zyx-filter-container">
                    <div class="zyx-filter-buttons">
                        <button class="zyx-filter-btn zyx-filter-active" onclick="filterTasks('all')" data-filter="all">All</button>
                        <button class="zyx-filter-btn" onclick="filterTasks('pending')" data-filter="pending">Pending</button>
                        <button class="zyx-filter-btn" onclick="filterTasks('working')" data-filter="working">Working</button>
                        <button class="zyx-filter-btn" onclick="filterTasks('done')" data-filter="done">Done</button>
                    </div>
                </div>
                
                <div class="zyx-tasks-container">
                    <div class="zyx-table-container">
                        <table id="tasksTable" class="zyx-tasks-table">
                            <thead class="zyx-table-header">
                                <tr class="zyx-header-row">
                                    <th class="zyx-header-cell" scope="col">ID</th>
                                    <th class="zyx-header-cell" scope="col">Title</th>
                                    <th class="zyx-header-cell" scope="col">Reward (min)</th>
                                    <th class="zyx-header-cell" scope="col">Status</th>
                                    <th class="zyx-header-cell" scope="col">Created</th>
                                    <th class="zyx-header-cell" scope="col">Actions</th>
                                </tr>
                            </thead>
                            <tbody id="tasksBody" class="zyx-table-body">
                                <!-- Tasks will be dynamically inserted here -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <script src="index.js"></script>
</body>
</html>
